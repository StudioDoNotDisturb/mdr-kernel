# Ships to: .github/workflows/doctor.yml
# The repo proves its own green state to every visitor. A passing badge on a
# coordination-machinery repo is the portfolio signal: it runs, and it checks itself.
#
# Depends on the cold-clone-aware / trimmed public doctor (spec GAP 1): on a fresh
# checkout with no personal memory, brain-doctor must pass — scaffolding the
# create-your-own files first, then running the checks that apply to the template.
#
# Hardening: default token permissions are read-only at the workflow level (least privilege —
# this workflow only reads the checkout and runs local scripts, it never needs to write).
# actions/checkout is pinned to an immutable commit SHA, not a floating tag, so a compromised
# or re-pointed tag cannot silently change what CI runs (verify/update the pin at
# https://github.com/actions/checkout/releases). Every job has a bounded timeout so a hang
# fails loud instead of burning CI minutes indefinitely.
name: doctor

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cold-clone-doctor:
    name: brain-doctor on a cold clone (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: PowerShell is preinstalled (pwsh)
        run: pwsh --version

      - name: Run hermetic privacy, onboarding, retrieval, and skill-structure batteries
        run: |
          pwsh -NoProfile -File tests/remote-privacy-unit.ps1
          pwsh -NoProfile -File tests/private-onboarding.ps1
          pwsh -NoProfile -File tests/node-map-retrieval.ps1
          pwsh -NoProfile -File tests/skill-structure.ps1

      - name: Arm the git hooks
        run: |
          git config core.hooksPath .githooks
          git remote remove origin

      - name: One-command local-only setup (scaffold create-your-own files)
        run: |
          git config user.name "mdr-kernel CI"
          git config user.email "ci@example.invalid"
          pwsh -NoProfile -File bin/setup-private.ps1 -Model "ci-doctor" -LocalOnly

      - name: Run canonical start — must reach READY on a cold clone
        run: pwsh -NoProfile -File bin/start-session.ps1 -Model "ci-doctor"
