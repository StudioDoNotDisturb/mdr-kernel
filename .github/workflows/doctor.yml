# Ships to: .github/workflows/doctor.yml
# The repo proves its own green state to every visitor. A passing badge on a
# coordination-machinery repo is the portfolio signal: it runs, and it checks itself.
#
# Depends on the cold-clone-aware / trimmed public doctor (spec GAP 1): on a fresh
# checkout with no personal memory, brain-doctor must pass — scaffolding the
# create-your-own files first, then running the checks that apply to the template.
#
# Hardening: default token permissions are read-only at the workflow level (least privilege —
# this workflow only reads the checkout and runs local scripts, it never needs to write).
# actions/checkout is pinned to an immutable commit SHA, not a floating tag, so a compromised
# or re-pointed tag cannot silently change what CI runs (verify/update the pin at
# https://github.com/actions/checkout/releases). Every job has a bounded timeout so a hang
# fails loud instead of burning CI minutes indefinitely.
name: doctor

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cold-clone-doctor:
    name: brain-doctor on a cold clone (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # 0.2 runs eight suites; windows-latest needed about 17 minutes in the private rehearsal
    # (2026-10-03), so 15 cancelled the job mid-suite. 30 keeps a bound with headroom.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # A PR checkout is a detached merge commit and a branch push is not main, but private
      # setup requires main. Name the commit under test local main, as in an adopter's clone;
      # setup-private keeps its main requirement unchanged.
      - name: Put the commit under test on local main
        shell: bash
        run: git checkout -B main

      - name: Test native history search
        run: cargo test --locked --manifest-path native/Cargo.toml

      - name: PowerShell is preinstalled (pwsh)
        run: pwsh --version

      # One explicit shell on both runners. Windows' default pwsh step checks only the LAST
      # command's exit code, so a failing suite earlier in a plain list would pass silently.
      - name: Run hermetic privacy, onboarding, retrieval, skill, envelope, decision, recall, and session batteries
        shell: pwsh
        run: |
          $failed = @()
          foreach ($suite in 'remote-privacy-unit','private-onboarding','node-map-retrieval','skill-structure',
                             'envelope-check','decision-authority','recall','session-safety') {
            pwsh -NoProfile -File "tests/$suite.ps1"
            if ($LASTEXITCODE -ne 0) { $failed += "$suite (exit $LASTEXITCODE)" }
          }
          if ($failed) { throw "failed suites: $($failed -join ', ')" }

      # Parity: the hook suites again, with the hooks running the native engine instead of the
      # shell gates. Same fixtures, same assertions, plus the engine-only trailer and staleness checks.
      - name: Run the hook suites through the native engine
        shell: pwsh
        run: |
          cargo build --locked --release --manifest-path native/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw 'native engine build failed' }
          $env:MDR_TEST_ENGINE = (Resolve-Path "native/target/release/mdr-kernel$(if ($IsWindows) { '.exe' })").Path
          $failed = @()
          foreach ($suite in 'envelope-check','session-safety','private-onboarding') {
            pwsh -NoProfile -File "tests/$suite.ps1"
            if ($LASTEXITCODE -ne 0) { $failed += "$suite (exit $LASTEXITCODE)" }
          }
          if ($failed) { throw "failed through the native engine: $($failed -join ', ')" }

      - name: Arm the git hooks
        shell: bash
        run: |
          git config core.hooksPath .githooks
          git remote remove origin

      - name: One-command local-only setup (scaffold create-your-own files)
        shell: bash
        run: |
          git config user.name "mdr-kernel CI"
          git config user.email "ci@example.invalid"
          pwsh -NoProfile -File bin/setup-private.ps1 -Model "ci-doctor" -LocalOnly

      - name: Run canonical start — must reach READY on a cold clone
        run: pwsh -NoProfile -File bin/start-session.ps1 -Model "ci-doctor"

      - name: Search a handoff from the new private memory
        shell: pwsh
        run: |
          Set-Content -LiteralPath handoffs/ci-search.md -Value "fixture quartz"
          $hits = cargo run --locked --manifest-path native/Cargo.toml -- find --query "quartz" --json
          if ($LASTEXITCODE -ne 0) { throw "history search failed" }
          if (($hits | ConvertFrom-Json)[0].path -ne "handoffs/ci-search.md") {
            throw "expected handoff was missing from history search"
          }
