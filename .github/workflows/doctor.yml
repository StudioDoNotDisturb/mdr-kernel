name: doctor

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  doctor:
    name: Cargo and cold clone (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Isolate the checkout
        shell: bash
        run: |
          git remote remove origin
          git checkout -B main
          test -z "$(git remote)"
      - name: Fetch locked dependencies
        shell: bash
        run: cargo fetch --locked --manifest-path native/Cargo.toml
      - name: Run Cargo tests, including the cold clone
        shell: bash
        run: cargo test --locked --offline --manifest-path native/Cargo.toml
