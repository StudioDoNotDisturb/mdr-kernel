# Ships to: .github/workflows/privacy-live-smoke.yml
# Optional integration evidence only. Required push/PR CI stays hermetic in doctor.yml.
name: privacy live smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  github-visibility:
    name: live GitHub visibility refusal
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Isolate the checkout and fetch locked dependencies
        shell: bash
        run: |
          git remote remove origin
          git checkout -B main
          test -z "$(git remote)"
          cargo fetch --locked --manifest-path native/Cargo.toml
      - name: Refuse a known public GitHub repository
        shell: bash
        run: cargo test --locked --offline --manifest-path native/Cargo.toml --test regressions live_public_repo_is_refused -- --ignored
