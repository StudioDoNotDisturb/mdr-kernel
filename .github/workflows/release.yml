# Builds checksummed Windows and Linux binaries and publishes them on version tags.
#
# Hardening: default token permissions are read-only at the workflow level; contents: write is
# granted only on the publishing job. Every action is pinned to an immutable commit SHA.
name: release

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: read

jobs:
  build:
    name: build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: mdr-kernel-linux-x86_64
            binary: native/target/release/mdr-kernel
          - os: windows-latest
            asset: mdr-kernel-windows-x86_64.exe
            binary: native/target/release/mdr-kernel.exe
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Isolate the checkout
        shell: bash
        run: |
          git remote remove origin
          git checkout -B main
          test -z "$(git remote)"

      - name: Build release binary
        run: cargo build --locked --release --manifest-path native/Cargo.toml

      - name: Run Rust tests
        run: cargo test --locked --manifest-path native/Cargo.toml

      - name: Stage platform binary
        shell: bash
        run: |
          mkdir -p dist
          cp "${{ matrix.binary }}" "dist/${{ matrix.asset }}"

      - name: Upload binary artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  release:
    name: publish release assets
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: mdr-kernel-*
          path: dist
          merge-multiple: true

      - name: Write SHA256SUMS.txt
        shell: bash
        run: |
          cd dist
          sha256sum mdr-kernel-linux-x86_64 mdr-kernel-windows-x86_64.exe > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=(--repo "${GITHUB_REPOSITORY}" --title "${GITHUB_REF_NAME}" --verify-tag --generate-notes)
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "${GITHUB_REF_NAME}" \
            dist/mdr-kernel-linux-x86_64 \
            dist/mdr-kernel-windows-x86_64.exe \
            dist/SHA256SUMS.txt \
            "${flags[@]}"
